name: Update GitHub Dashboard

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate dashboard assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p assets/dashboard

          python3 <<'PY'
          import json, os, subprocess
          from datetime import datetime, timezone, timedelta
          from html import escape

          user = "Azevd0"
          token = os.environ["GH_TOKEN"]

          query = r'''
          query($login:String!) {
            user(login:$login) {
              name
              login
              followers { totalCount }
              following { totalCount }
              repositories(first:100, ownerAffiliations:OWNER, privacy:PUBLIC) {
                totalCount
                nodes {
                  name
                  stargazerCount
                  forkCount
                  primaryLanguage { name }
                }
              }

              languageRepositories: repositories(
                first:100,
                ownerAffiliations:OWNER,
                privacy:PUBLIC,
                isFork:false
              ) {
                nodes {
                  primaryLanguage { name }
                  languages(first:10, orderBy:{field:SIZE, direction:DESC}) {
                    edges { size node { name } }
                  }
                }
              }
              contributionsCollection {
                totalCommitContributions
                totalIssueContributions
                totalPullRequestContributions
                totalRepositoryContributions
                restrictedContributionsCount
                contributionCalendar {
                  totalContributions
                  weeks {
                    contributionDays {
                      contributionCount
                      date
                    }
                  }
                }
              }
            }
          }
          '''

          payload = json.dumps({"query": query, "variables": {"login": user}})
          result = subprocess.run(
              ["curl", "-fsSL", "-H", f"Authorization: bearer {token}",
               "-H", "Content-Type: application/json",
               "-d", payload, "https://api.github.com/graphql"],
              capture_output=True, text=True, check=True
          )
          data = json.loads(result.stdout)
          if "errors" in data:
              raise SystemExit(json.dumps(data["errors"]))

          u = data["data"]["user"]
          repos = u["repositories"]["nodes"]
          lang_repos = u["languageRepositories"]["nodes"]
          cc = u["contributionsCollection"]
          calendar = cc["contributionCalendar"]

          def esc(s):
              return escape(str(s), quote=True)

          def svg(text, width=900, height=220):
              return f'''<svg xmlns="http://www.w3.org/2000/svg" width="{width}" height="{height}" viewBox="0 0 {width} {height}">
          <rect width="100%" height="100%" rx="12" fill="#0d1117"/>
          {text}
          </svg>'''

          def text(x, y, value, size=14, weight="400", fill="#c9d1d9"):
              return f'<text x="{x}" y="{y}" fill="{fill}" font-family="Arial, Helvetica, sans-serif" font-size="{size}" font-weight="{weight}">{esc(value)}</text>'

          total_stars = sum(r["stargazerCount"] for r in repos)
          total_forks = sum(r["forkCount"] for r in repos)
          commits = cc["totalCommitContributions"]
          prs = cc["totalPullRequestContributions"]
          issues = cc["totalIssueContributions"]
          total_contrib = calendar["totalContributions"]

          stats = [
              ("Repositórios", u["repositories"]["totalCount"]),
              ("Seguidores", u["followers"]["totalCount"]),
              ("Estrelas", total_stars),
              ("Contribuições", total_contrib),
              ("Commits", commits),
              ("Pull requests", prs),
          ]
          parts = [
              text(28, 38, "Estatísticas do GitHub", 22, "700", "#f0f6fc"),
              text(28, 62, f"@{u['login']}", 13, "400", "#8b949e")
          ]
          for i, (label, value) in enumerate(stats):
              col = i % 3
              row = i // 3
              x = 28 + col * 195
              y = 105 + row * 65
              parts += [text(x, y, str(value), 24, "700", "#58a6ff"),
                        text(x, y + 22, label, 12, "400", "#8b949e")]
          open("assets/dashboard/stats.svg","w").write(svg("".join(parts), 620, 220))

          # Language dashboard: only original repositories, excluding languages
          # that are not part of the user's current development stack.
          ignored_languages = {"Go", "Python", "Shell"}
          language_sizes = {}
          for r in lang_repos:
              for edge in r["languages"]["edges"]:
                  name = edge["node"]["name"]
                  if name in ignored_languages:
                      continue
                  language_sizes[name] = language_sizes.get(name, 0) + edge["size"]

          langs = sorted(language_sizes.items(), key=lambda x: x[1], reverse=True)[:8]
          total = sum(v for _, v in langs) or 1
          parts = [text(28, 38, "Linguagens mais utilizadas", 22, "700", "#f0f6fc")]
          y = 72
          for name, size in langs:
              pct = size / total * 100
              parts += [text(28, y, name, 13, "400", "#c9d1d9"),
                        text(690, y, f"{pct:.1f}%", 13, "700", "#8b949e")]
              parts.append(f'<rect x="28" y="{y+10}" width="700" height="8" rx="4" fill="#21262d"/>')
              parts.append(f'<rect x="28" y="{y+10}" width="{700*pct/100:.1f}" height="8" rx="4" fill="#58a6ff"/>')
              y += 35
          open("assets/dashboard/languages.svg","w").write(svg("".join(parts), 760, max(130, y+10)))

          days = []
          for week in calendar["weeks"]:
              days.extend(week["contributionDays"])
          days = sorted(days, key=lambda d: d["date"])
          recent = days[-365:]
          cols = 53
          cell = 13
          gap = 3
          parts = [text(28, 30, "Atividade no GitHub", 22, "700", "#f0f6fc"),
                   text(28, 52, f"{total_contrib} contribuições no último ano", 12, "400", "#8b949e")]
          max_count = max([d["contributionCount"] for d in recent] or [1])
          start_x, start_y = 28, 68
          for i, d in enumerate(recent):
              col = i // 7
              row = i % 7
              x = start_x + col*(cell+gap)
              y = start_y + row*(cell+gap)
              intensity = d["contributionCount"]/max_count
              if d["contributionCount"] == 0:
                  fill = "#161b22"
              elif intensity < .25:
                  fill = "#0e4429"
              elif intensity < .5:
                  fill = "#006d32"
              elif intensity < .75:
                  fill = "#26a641"
              else:
                  fill = "#39d353"
              parts.append(f'<rect x="{x}" y="{y}" width="{cell}" height="{cell}" rx="2" fill="{fill}"><title>{d["date"]}: {d["contributionCount"]} contributions</title></rect>')
          open("assets/dashboard/activity.svg","w").write(svg("".join(parts), 1200, 190))

          # Current contribution streak.
          streak = 0
          today = datetime.now(timezone.utc).date()
          by_date = {datetime.strptime(d["date"], "%Y-%m-%d").date(): d["contributionCount"] for d in days}
          cursor = today
          if by_date.get(cursor, 0) == 0:
              cursor -= timedelta(days=1)
          while by_date.get(cursor, 0) > 0:
              streak += 1
              cursor -= timedelta(days=1)

          parts = [text(28, 38, "Sequência de contribuições", 22, "700", "#f0f6fc"),
                   text(28, 92, str(streak), 42, "700", "#58a6ff"),
                   text(28, 120, "dias consecutivos", 13, "400", "#8b949e")]
          open("assets/dashboard/streak.svg","w").write(svg("".join(parts), 260, 150))

          print("Dashboard generated successfully.")
          PY

      - name: Commit dashboard assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/dashboard
          if git diff --cached --quiet; then
            echo "No dashboard changes."
          else
            git commit -m "chore: update GitHub dashboard"
            git push
          fi
