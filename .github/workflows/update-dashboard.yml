name: Atualizar Dashboard do GitHub

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gerar dashboard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p assets/dashboard

          python3 <<'PY'
          import json
          import os
          import subprocess
          from datetime import datetime, timezone, timedelta
          from html import escape
          import math

          user = "Azevd0"
          token = os.environ["GH_TOKEN"]

          query = '''
          query($login:String!, $issueQuery:String!) {
            search(query:$issueQuery, type:ISSUE, first:1) {
              issueCount
            }
            user(login:$login) {
              login
              followers { totalCount }
              repositories(first:100, ownerAffiliations:OWNER, privacy:PUBLIC) {
                totalCount
                nodes {
                  stargazerCount
                }
              }
              languageRepositories: repositories(
                first:100,
                ownerAffiliations:OWNER,
                privacy:PUBLIC,
                isFork:false
              ) {
                nodes {
                  languages(first:10, orderBy:{field:SIZE, direction:DESC}) {
                    edges {
                      size
                      node { name }
                    }
                  }
                }
              }
              contributionsCollection {
                totalCommitContributions
                totalPullRequestContributions
                contributionCalendar {
                  totalContributions
                  weeks {
                    contributionDays {
                      contributionCount
                      date
                    }
                  }
                }
              }
            }
          }
          '''

          payload = json.dumps({
              "query": query,
              "variables": {
                  "login": user,
                  "issueQuery": f"author:{user} is:issue"
              }
          })

          result = subprocess.run(
              [
                  "curl", "-fsSL",
                  "-H", f"Authorization: bearer {token}",
                  "-H", "Content-Type: application/json",
                  "-d", payload,
                  "https://api.github.com/graphql"
              ],
              capture_output=True,
              text=True,
              check=True
          )

          data = json.loads(result.stdout)
          if "errors" in data:
              raise SystemExit(json.dumps(data["errors"]))

          u = data["data"]["user"]
          repos = u["repositories"]["nodes"]
          lang_repos = u["languageRepositories"]["nodes"]
          cc = u["contributionsCollection"]
          calendar = cc["contributionCalendar"]
          issues = data["data"]["search"]["issueCount"]
          commits = cc["totalCommitContributions"]
          prs = cc["totalPullRequestContributions"]

          FONT = "Fira Code, monospace"
          BG = "#0b1422"
          BORDER = "#16304f"
          TEXT = "#f0f6fc"
          MUTED = "#8b949e"
          BLUE = "#3178ff"

          def esc(value):
              return escape(str(value), quote=True)

          def text(x, y, value, size=11, weight="400", fill=TEXT, anchor="start"):
              return (
                  f'<text x="{x}" y="{y}" fill="{fill}" '
                  f'font-family="{FONT}" font-size="{size}px" '
                  f'font-weight="{weight}" text-anchor="{anchor}">{esc(value)}</text>'
              )

          def frame(width, height, content):
              return (
                  f'<svg xmlns="http://www.w3.org/2000/svg" width="{width}" height="{height}" '
                  f'viewBox="0 0 {width} {height}">'
                  f'<rect width="100%" height="100%" rx="12" fill="{BG}"/>'
                  f'<rect x="1" y="1" width="{width-2}" height="{height-2}" rx="11" fill="none" stroke="{BORDER}"/>'
                  f'{content}</svg>'
              )

          # -------------------- Linguagens --------------------
          ignored = {"Go", "Python", "Shell"}
          language_sizes = {}
          for repo in lang_repos:
              for edge in repo["languages"]["edges"]:
                  name = edge["node"]["name"]
                  if name in ignored:
                      continue
                  language_sizes[name] = language_sizes.get(name, 0) + edge["size"]

          langs = sorted(language_sizes.items(), key=lambda item: item[1], reverse=True)[:6]
          total_size = sum(size for _, size in langs) or 1
          colors = ["#3178ff", "#f1e05a", "#e34c26", "#f34b7d", "#563d7c", "#8b949e"]

          parts = [text(22, 30, "Linguagens mais utilizadas", 15, "700")]
          cx, cy, radius, stroke = 82, 108, 55, 27
          circumference = 2 * math.pi * radius
          cumulative = 0

          for i, (name, size) in enumerate(langs):
              pct = size / total_size
              dash = pct * circumference
              offset = -cumulative * circumference
              parts.append(
                  f'<circle cx="{cx}" cy="{cy}" r="{radius}" fill="none" '
                  f'stroke="{colors[i % len(colors)]}" stroke-width="{stroke}" '
                  f'stroke-dasharray="{dash:.2f} {circumference:.2f}" '
                  f'stroke-dashoffset="{offset:.2f}" transform="rotate(-90 {cx} {cy})"/>'
              )
              cumulative += pct

          parts.append(f'<circle cx="{cx}" cy="{cy}" r="39" fill="{BG}"/>')
          parts.append(text(cx, cy + 5, str(u["repositories"]["totalCount"]), 20, "700", TEXT, "middle"))
          parts.append(text(cx, cy + 23, "repos", 9, "400", MUTED, "middle"))

          y = 67
          for i, (name, size) in enumerate(langs):
              pct = size / total_size * 100
              color = colors[i % len(colors)]
              parts.append(f'<circle cx="177" cy="{y-4}" r="4" fill="{color}"/>')
              parts.append(text(190, y, name, 10, "400", "#c9d1d9"))
              parts.append(text(488, y, f"{pct:.1f}%", 10, "700", MUTED, "end"))
              y += 23

          open("assets/dashboard/languages.svg", "w", encoding="utf-8").write(
              frame(520, 210, "".join(parts))
          )

          # -------------------- Atividade --------------------
          days = []
          for week in calendar["weeks"]:
              days.extend(week["contributionDays"])
          days = sorted(days, key=lambda day: day["date"])[-365:]

          by_date = {
              datetime.strptime(day["date"], "%Y-%m-%d").date(): day["contributionCount"]
              for day in days
          }
          today = datetime.now(timezone.utc).date()
          cursor = today
          streak = 0
          if by_date.get(cursor, 0) == 0:
              cursor -= timedelta(days=1)
          while by_date.get(cursor, 0) > 0:
              streak += 1
              cursor -= timedelta(days=1)

          parts = [
              text(22, 30, "Atividade no GitHub", 15, "700"),
              text(498, 30, "Últimos 12 meses", 9, "400", MUTED, "end"),
              text(22, 58, commits, 16, "700", BLUE),
              text(22, 73, "Commits", 9, "400", MUTED),
              text(140, 58, prs, 16, "700", BLUE),
              text(140, 73, "Pull requests", 9, "400", MUTED),
              text(258, 58, issues, 16, "700", BLUE),
              text(258, 73, "Issues", 9, "400", MUTED),
              text(376, 58, streak, 16, "700", BLUE),
              text(376, 73, "Streak", 9, "400", MUTED),
          ]

          max_count = max((day["contributionCount"] for day in days), default=1)
          cell = 8
          gap = 2
          start_x = 22
          start_y = 91

          for i, day in enumerate(days):
              col = i // 7
              row = i % 7
              x = start_x + col * (cell + gap)
              y = start_y + row * (cell + gap)
              intensity = day["contributionCount"] / max_count
              if day["contributionCount"] == 0:
                  fill = "#101a27"
              elif intensity < .25:
                  fill = "#123f4a"
              elif intensity < .50:
                  fill = "#146c7d"
              elif intensity < .75:
                  fill = "#1ca5b8"
              else:
                  fill = "#35d6e5"
              parts.append(
                  f'<rect x="{x}" y="{y}" width="{cell}" height="{cell}" rx="2" fill="{fill}">'
                  f'<title>{esc(day["date"])}: {day["contributionCount"]} contribuições</title></rect>'
              )

          parts += [
              text(22, 176, "Menos atividade", 8, "400", MUTED),
              text(498, 176, "Mais atividade", 8, "400", MUTED, "end"),
          ]

          open("assets/dashboard/activity.svg", "w", encoding="utf-8").write(
              frame(520, 195, "".join(parts))
          )
          PY

      - name: Commit dashboard assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/dashboard/languages.svg assets/dashboard/activity.svg
          if git diff --cached --quiet; then
            echo "Nenhuma alteração no dashboard."
          else
            git commit -m "chore: atualizar dashboard do GitHub"
            git push
          fi
