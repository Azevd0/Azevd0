name: Atualizar Dashboard do GitHub

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gerar dashboard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p assets/dashboard
          python3 <<'PY'
          import json, math, os, subprocess
          from datetime import datetime, timezone, timedelta
          from html import escape

          USER = "Azevd0"
          TOKEN = os.environ["GH_TOKEN"]
          FONT = "Fira Code, monospace"
          BG, BORDER, TEXT, MUTED, BLUE = "#0b1422", "#16304f", "#f0f6fc", "#8b949e", "#3178ff"

          def text(x,y,v,size=12,weight="400",fill=TEXT,anchor="start"):
              return f'<text x="{x}" y="{y}" fill="{fill}" font-family="{FONT}" font-size="{size}px" font-weight="{weight}" text-anchor="{anchor}">{escape(str(v))}</text>'
          def frame(w,h,c):
              return f'<svg xmlns="http://www.w3.org/2000/svg" width="{w}" height="{h}" viewBox="0 0 {w} {h}"><rect width="100%" height="100%" rx="14" fill="{BG}"/><rect x="1" y="1" width="{w-2}" height="{h-2}" rx="13" fill="none" stroke="{BORDER}"/>{c}</svg>'

          # GraphQL: repositories, languages, commits, PRs and contribution calendar.
          q = '''query($login:String!){user(login:$login){repositories(first:100,ownerAffiliations:OWNER,privacy:PUBLIC){totalCount} languageRepositories:repositories(first:100,ownerAffiliations:OWNER,privacy:PUBLIC,isFork:false){nodes{languages(first:10,orderBy:{field:SIZE,direction:DESC}){edges{size node{name}}}}} contributionsCollection{totalCommitContributions totalPullRequestContributions contributionCalendar{weeks{contributionDays{date contributionCount}}}}}}'''
          p = json.dumps({"query":q,"variables":{"login":USER}})
          raw = subprocess.run(["curl","-fsSL","-H",f"Authorization: bearer {TOKEN}","-H","Content-Type: application/json","-d",p,"https://api.github.com/graphql"],capture_output=True,text=True,check=True).stdout
          d=json.loads(raw)
          if d.get("errors"): raise SystemExit(json.dumps(d["errors"]))
          u=d["data"]["user"]
          cc=u["contributionsCollection"]

          # Profile-wide authored Issues. This is deliberately independent of the contribution calendar.
          issue_url=f"https://api.github.com/search/issues?q=author:{USER}%20is:issue&per_page=1"
          issue_data=json.loads(subprocess.run(["curl","-fsSL","-H","Accept: application/vnd.github+json",issue_url],capture_output=True,text=True,check=True).stdout)
          issues=issue_data["total_count"]
          commits=cc["totalCommitContributions"]
          prs=cc["totalPullRequestContributions"]

          # Languages: original repositories only; intentionally exclude Go/Python/Shell.
          sizes={}
          for repo in u["languageRepositories"]["nodes"]:
              for e in repo["languages"]["edges"]:
                  name=e["node"]["name"]
                  if name not in {"Go","Python","Shell"}: sizes[name]=sizes.get(name,0)+e["size"]
          langs=sorted(sizes.items(),key=lambda x:x[1],reverse=True)[:6]
          total=sum(v for _,v in langs) or 1
          colors=["#3178ff","#f1e05a","#e34c26","#f34b7d","#563d7c","#8b949e"]
          parts=[text(28,38,"Linguagens mais utilizadas",18,"700")]
          cx,cy,r,sw=145,150,82,36
          circ=2*math.pi*r; acc=0
          for i,(name,size) in enumerate(langs):
              pct=size/total; dash=pct*circ
              parts.append(f'<circle cx="{cx}" cy="{cy}" r="{r}" fill="none" stroke="{colors[i]}" stroke-width="{sw}" stroke-dasharray="{dash:.2f} {circ:.2f}" stroke-dashoffset="{-acc*circ:.2f}" transform="rotate(-90 {cx} {cy})"/>')
              acc+=pct
          parts += [f'<circle cx="{cx}" cy="{cy}" r="64" fill="{BG}"/>',text(cx,cy+9,u["repositories"]["totalCount"],30,"700",TEXT,"middle"),text(cx,cy+34,"repos",12,"400",MUTED,"middle")]
          y=78
          for i,(name,size) in enumerate(langs):
              parts += [f'<circle cx="390" cy="{y-5}" r="5" fill="{colors[i]}"/>',text(408,y,name,15,"400","#c9d1d9"),text(730,y,f"{size/total*100:.1f}%",15,"700",MUTED,"end")]
              y+=34
          open("assets/dashboard/languages.svg","w",encoding="utf-8").write(frame(780,300,"".join(parts)))

          # Activity and current Streak.
          days=sorted([x for w in cc["contributionCalendar"]["weeks"] for x in w["contributionDays"]],key=lambda x:x["date"])[-365:]
          bydate={datetime.strptime(x["date"],"%Y-%m-%d").date():x["contributionCount"] for x in days}
          cur=datetime.now(timezone.utc).date(); streak=0
          if bydate.get(cur,0)==0: cur-=timedelta(days=1)
          while bydate.get(cur,0)>0: streak+=1; cur-=timedelta(days=1)
          parts=[text(28,38,"Atividade no GitHub",18,"700"),text(752,38,"Últimos 12 meses",10,"400",MUTED,"end"),text(28,76,commits,22,"700",BLUE),text(28,96,"Commits",10,"400",MUTED),text(190,76,prs,22,"700",BLUE),text(190,96,"Pull requests",10,"400",MUTED),text(352,76,issues,22,"700",BLUE),text(352,96,"Issues",10,"400",MUTED),text(514,76,streak,22,"700",BLUE),text(514,96,"Streak",10,"400",MUTED)]
          mx=max([x["contributionCount"] for x in days] or [1]); cell=12; gap=3
          for i,x in enumerate(days):
              col,row=i//7,i%7; px,py=28+col*(cell+gap),120+row*(cell+gap); n=x["contributionCount"]; z=n/mx
              fill="#101a27" if n==0 else "#123f4a" if z<.25 else "#146c7d" if z<.5 else "#1ca5b8" if z<.75 else "#35d6e5"
              parts.append(f'<rect x="{px}" y="{py}" width="{cell}" height="{cell}" rx="2" fill="{fill}"><title>{x["date"]}: {n} contribuições</title></rect>')
          parts += [text(28,277,"Menos atividade",10,"400",MUTED),text(752,277,"Mais atividade",10,"400",MUTED,"end")]
          open("assets/dashboard/activity.svg","w",encoding="utf-8").write(frame(780,300,"".join(parts)))
          PY

      - name: Commit dashboard assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/dashboard/languages.svg assets/dashboard/activity.svg
          git diff --cached --quiet || (git commit -m "chore: atualizar dashboard do GitHub" && git push)
