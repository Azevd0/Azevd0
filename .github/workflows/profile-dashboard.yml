name: Atualizar Dashboard do Perfil

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Gerar cards do perfil
        uses: seijikohara/profile-cards-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: Azevd0
          cards: overview,contributions,languages,momentum
          output-dir: assets
          themes: light,dark
          language-limit: 8
          commit: true
          commit-message: "chore(profile): atualizar dashboard [skip ci]"
